name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - run: gradle assembleDebug --stacktrace
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "Jarvis ${{ github.run_number }}" --notes "APK de Jarvis"
